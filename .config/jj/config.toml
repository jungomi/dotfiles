#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Michael Jungo"
email = "michaeljungo92@gmail.com"

[ui]
# Make status the default command
default-command = "status"
diff-formatter = ":git"
diff-instructions = false
diff-editor = "codediff"

# Important: This is only for diffs (e.g. `jj split`) not merge conflicts.
# The merge-ditor is not compatible with codediff.
# Workaround: Just launch codediff manually (it's literally just that `jj resolve` sucks).
[merge-tools.codediff]
program = "nvim"
edit-args = ["-c", "CodeDiff --exit-on-close dir $left $right"]

# Use delta as a pager only for the commands that provide a diff.
# Other commands would work fine with delta, but this is mainly due
# to the fact that I want to not clear the screen on other commands,
# but delta does by default (which I want for the diffs).
[[--scope]]
--when.commands = ["diff", "show", "interdiff", "op diff", "op show"]
[--scope.ui]
pager = "delta"

[aliases]
lg = ["log", "-T", "lg"]
# Fetch from remote and rebase local mutable commits onto updated trunk(), basically `git pull`.
pull = [
    "util",
    "exec",
    "--",
    "bash",
    "-c",
    "jj git fetch && jj rebase -d 'trunk()'",
]
# Just too lazy for an extra subcommand.
push = ["git", "push"]
clone = ["git", "clone"]
init = ["git", "init"]
# Like `git switch -` return back to the previously checked out commit.
# Taken from: https://github.com/jj-vcs/jj/discussions/8423
- = [
    "util",
    "exec",
    "--",
    "bash",
    "-c",
    """
    resolve () { jj log --no-graph -r@ -T'change_id.short() ++ "\\n"' "$@"; }
    current=$(resolve)
    jj op log --no-graph -T 'id.short() ++ "\\n"' | while read op; do
        old=$(resolve --at-op $op)
        if [[ $old != $current ]]; then
            if ! jj edit $old 2>/dev/null; then
                old_commit=$(jj evolog -r $old --at-op $op --no-graph -T 'commit_id.short()')
                jj edit $old_commit
            fi
            exit 0
        fi
    done
    """,
    "jj-back",
]
# Interactively pick any commit from the log with fzf
fzf = [
    "util",
    "exec",
    "--",
    "bash",
    "-c",
    """
    jj lg --no-graph --color=always  \
      | fzf --ansi --no-sort --preview 'jj show --color=always {1}' \
      | awk '{print $1}'
    """,
]
# Wrapper alias that reuses `jj fzf` and appends the chosen rev provided command.
# Example: `jj z squash -t` ==> `jj z squash -t $(jj fzf)`
z = [
    "util",
    "exec",
    "--",
    "bash",
    "-c",
    """
    set -euo pipefail
    rev=$(jj fzf)
    [ -n "$rev" ] && exec jj "$@" "$rev"
    """,
    "jj-z",
]

[revsets]
log = "present(@) | ancestors(immutable_heads().., 10) | ancestors(present(trunk()), 10)"
bookmark-advance-to = "closest_pushable(@)"

[revset-aliases]
junk = '(mutable() & empty()) ~ working_copies() ~ parents(..) ~ bookmarks()'
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & ~description(exact:"") & (~empty() | merges()))'

[templates]
log = "builtin_log_detailed"

[template-aliases]
# This is similar to my `git lg` output
lg = '''
if(root,
  format_root_commit(self),
  separate(" ",
    change_id.shortest(8),
    commit_id.shortest(7),
    "-",
    label("relative_time", "(" ++ committer.timestamp().ago() ++ ")"),
    if(description,
      description.first_line(),
      label(if(empty, "empty"), description_placeholder)
    ),
    label("author_name", "- " ++ coalesce(author.name(), author.email(), "(no name)")),
    label("decorations", separate(" ",
      bookmarks,
      tags,
      working_copies,
      if(conflict, label("conflict", "(conflict)")),
      if(empty, label("empty", "(empty)")),
    )),
  ) ++ "\n"
)
'''

[colors]
"change_id" = { fg = "magenta", bold = true }
"commit_id" = { fg = "blue", bold = true }
"relative_time" = { fg = "green", bold = true }
"relative_time committer timestamp ago" = { fg = "green", bold = true }
"author_name" = { fg = "cyan" }
"author_name author name" = { fg = "cyan" }
"author_name author email" = { fg = "cyan" }
"description placeholder" = { fg = "bright black", italic = true }
"decorations" = { fg = "magenta", bold = true }
"decorations bookmarks" = { fg = "yellow", bold = true }
"decorations working_copies" = { fg = "magenta", bold = true }
# jj status
"diff summary added" = { fg = "green", bold = true }
"diff summary modified" = { fg = "yellow", bold = true }
"diff summary renamed" = { fg = "yellow", bold = true }
"diff summary removed" = { fg = "red", bold = true }
